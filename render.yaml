# Render Blueprint — bot tín hiệu swing crypto
# QUAN TRỌNG: region phải ở ngoài Mỹ vì Binance chặn IP Mỹ (HTTP 451).
services:
  - type: web
    name: ai-signal-bot-v3
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: NEWS_BOT_TOKEN      # 📰 Bot Tin tức (bot thứ 2, chạy chung dịch vụ)
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL        # Postgres miễn phí của Neon (neon.tech) — ổ đĩa Render bị xóa khi khởi động lại
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: CRYPTOPANIC_TOKEN   # tùy chọn, miễn phí tại cryptopanic.com/developers/api
        sync: false
      - key: GEMINI_API_KEY      # tùy chọn: AI hỏi đáp (miễn phí tại aistudio.google.com)
        sync: false
      - key: GROQ_API_KEY        # tùy chọn: AI dự phòng 1 (console.groq.com)
        sync: false
      - key: OPENROUTER_API_KEY  # tùy chọn: AI dự phòng 2 (openrouter.ai)
        sync: false
      - key: PRIVATE_MODE        # 1 = người mới phải được admin duyệt
        value: "1"
      - key: TOP_N
        value: "20"
      - key: MAX_SIGNALS_PER_DAY
        value: "3"
      - key: DEFAULT_RISK_PCT
        value: "0.5"
